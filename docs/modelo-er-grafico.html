const W=310,RH=19,HH=30,GX=120,GY=40,NS='http://www.w3.org/2000/svg';
const by={};T.forEach(t=>{by[t.name]=t;t.h=HH+t.rows.length*RH+6;t.parents=[...new Set(t.rows.filter(r=>r.k==='fk'&&r.target!==t.name).map(r=>r.target))];});
const depth={};const d=t=>depth[t.name]??(depth[t.name]=t.parents.length?1+Math.max(...t.parents.map(p=>d(by[p]))):0);T.forEach(d);
const layers={};T.forEach(t=>(layers[depth[t.name]]=layers[depth[t.name]]||[]).push(t));

const gT=document.getElementById('tables'),gL=document.getElementById('lines'),world=document.getElementById('world'),cv=document.getElementById('cv');
T.forEach(t=>{const g=mk('g',{class:'tbl'+(t.name==='contact'?' std':'')},gT);t.g=g;

 t.rows.forEach((r,i)=>{const y=HH+i*RH;if(r.k!=='col')mk('rect',{class:r.k+'bg',x:1,y,width:W-2,height:RH},g);
  const a=mk('text',{class:'r',x:8,y:y+13.5},g);a.textContent=(r.k==='pk'?'🔑 ':'')+r.n;if(r.k==='pk'||r.k==='main')a.setAttribute('font-weight','700');
  const b=mk('text',{class:'ty',x:W-8,y:y+13.5,'text-anchor':'end'},g);b.textContent=r.t;});
 g.addEventListener('mouseenter',()=>hi(t));g.addEventListener('mouseleave',()=>hi(null));
 g.querySelector('.head').addEventListener('mousedown',e=>{e.stopPropagation();drag={t,sx:e.clientX,sy:e.clientY,ox:t.x,oy:t.y};});});
const rels=[];T.forEach(c=>c.rows.filter(r=>r.k==='fk').forEach((r,_)=>rels.push({c,p:by[r.target],r,i:c.rows.indexOf(r)})));
rels.forEach(l=>{l.path=mk('path',{class:'rel'+(l.r.req?'':' opt')},gL);l.path.innerHTML='<title>'+l.r.rel+' ('+l.r.n+')</title>';l.a=mk('text',{class:'card'},gL);l.b=mk('text',{class:'card'},gL);l.a.textContent='1';l.b.textContent='N';});

 rels.forEach(l=>{const c=l.c,p=l.p,cy=c.y+HH+l.i*RH+RH/2,py=p.y+HH+RH/2;let x1,x2,s1,s2;
  if(c===p){x1=c.x+W;x2=c.x+W;s1=1;s2=1;const o=60;l.path.setAttribute('d','M'+x1+' '+(py)+' C'+(x1+o)+' '+py+' '+(x2+o)+' '+cy+' '+x2+' '+cy);l.a.setAttribute('x',x1+6);l.a.setAttribute('y',py-4);l.b.setAttribute('x',x2+6);l.b.setAttribute('y',cy+14);return;}
  if(c.x>=p.x+W){x1=p.x+W;x2=c.x;s1=1;s2=-1;}else if(c.x+W<=p.x){x1=p.x;x2=c.x+W;s1=-1;s2=1;}else{x1=p.x+W;x2=c.x+W;s1=1;s2=1;}

function hi(t){T.forEach(x=>x.g.classList.toggle('dim',!!t&&x!==t&&!rels.some(l=>(l.c===t&&l.p===x)||(l.p===t&&l.c===x))));
