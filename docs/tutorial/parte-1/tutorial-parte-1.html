<style>
  :root { --brand:#1d4ed8; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f3f5f9; --surface:#fff; --side:#0f1b33; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:'Segoe UI',system-ui,sans-serif; color:var(--ink); background:var(--bg); display:grid; grid-template-columns:300px 1fr; }

  aside h1 { color:#fff; font-size:15px; margin:0 6px 2px; }
  aside .sub { font-size:12px; margin:0 6px 14px; color:#8a9bb8; }
  .sec { font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#8a9bb8; margin:14px 6px 4px; }
  .nav button { display:flex; gap:8px; width:100%; padding:6px 8px; border:0; border-radius:6px; background:transparent; color:inherit; text-align:left; font:inherit; font-size:13px; cursor:pointer; }
  .nav button:hover { background:#1b2a47; }
  .nav button.on { background:var(--brand); color:#fff; }
  .nav button.done .n { background:#15803d; color:#fff; }
  .nav .n { flex-shrink:0; width:20px; height:20px; border-radius:50%; background:#1e2b45; display:grid; place-items:center; font-size:10.5px; }
  .tree { margin:18px 6px 0; padding:10px; border-radius:8px; background:#0b1428; font-family:Consolas,monospace; font-size:11px; line-height:1.6; }
  .tree div { color:#475569; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tree div.ok { color:#86efac; } .tree div.new { color:#fde047; font-weight:700; }
  main { overflow-y:auto; display:flex; flex-direction:column; }
  .bar { height:4px; background:var(--line); } .bar span { display:block; height:100%; background:var(--brand); transition:width .3s; }
  .content { max-width:1000px; width:100%; margin:0 auto; padding:26px 32px 110px; }
  .crumb { color:var(--brand); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
  h2 { font-size:26px; margin:4px 0 14px; }
  h3 { margin:18px 0 8px; }
  p, li { line-height:1.6; }

  .file__head .copy:hover { background:var(--brand); }
  .file__body { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); }
  .code { background:#0f172a; color:#e2e8f0; font-family:Consolas,'Cascadia Mono',monospace; font-size:12.5px; line-height:1.55; overflow-x:auto; padding:10px 0; }
  .code div { display:flex; padding-right:12px; white-space:pre; }
  .code div.hl { background:#1e3a8a; }
  .code .ln { flex-shrink:0; width:42px; padding-right:12px; text-align:right; color:#475569; user-select:none; }

  .notes .note-i { display:flex; gap:8px; padding:7px 8px; border-radius:8px; font-size:13.5px; line-height:1.5; cursor:default; }
  .notes .note-i:hover { background:#eef3ff; }
  .notes .tag { flex-shrink:0; height:20px; padding:0 6px; border-radius:6px; background:#e8edf5; font-family:Consolas,monospace; font-size:11px; display:grid; place-items:center; color:var(--brand); font-weight:700; }

  .note { background:#eef3ff; border-left:4px solid var(--brand); } .note.warn { background:#fef6e0; border-left-color:#ca8a04; }
  .concept { background:#f5f8ff; border:1px solid #c7d7fb; }
  .db { background:#fffbeb; border:1px solid #fde68a; }
  .check { background:#f0fdf4; border:1px solid #bbf7d0; } .check ul { list-style:none; padding-left:0; margin:4px 0 0; }

  .concept__title, .db__title, .check__title { font-weight:700; margin-bottom:4px; }

  table.grid th, table.grid td { border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top; }

  .nav-btns { position:fixed; bottom:0; left:300px; right:0; display:flex; justify-content:space-between; align-items:center; padding:12px 32px; background:rgba(255,255,255,.95); border-top:1px solid var(--line); }

  .prev { background:#e8edf5; color:var(--ink); } .next { background:var(--brand); color:#fff; }
  .nav-btns button:disabled { opacity:.4; cursor:default; }
  .count { color:var(--muted); font-size:13px; }
  @media (max-width: 1000px) { .file__body { grid-template-columns:1fr; } .notes { border-left:0; border-top:1px solid var(--line); max-height:none; } }

cfigcaption>La meta: la tarjeta con los tres perfiles. Al abrir uno, la app consulta Dataverse y muestra las personas que tienen ese rol.\u003c/figcaption>\u003c/figure>\n\u003ch3>Cómo usar este tutorial\u003c/h3>\n\u003cul>\n  \u003cli>Avanza con \u003ckbd>→\u003c/kbd> o el botón \u003cstrong>Siguiente\u003c/strong>, y retrocede con \u003ckbd>←\u003c/kbd>. El tutorial recuerda en qué paso quedaste.\u003c/li>\n  \u003cli>Cada paso de código te dice \u003cstrong>qué archivo crear\u003c/strong>, te da el código completo con el botón \u003cstrong>Copiar\u003c/strong> y lo explica \u003cstrong>línea por línea\u003c/strong>. Pasa el mouse sobre una explicación y se resalta su línea.\u003c/li>\n  \u003cli>El árbol de la izquierda (abajo) muestra los archivos que ya creaste.\u003c/li>\n  \u003cli>\u003cstrong>Escribe el código tú mismo\u003c/strong> en vez de copiarlo cuando puedas: así se aprende de verdad. El botón Copiar está para cuando te trabes.\u003c/li>\n  \u003cli>Si algo falla, compara con la carpeta \u003ccode>docs/tutorial/parte-1/solucion\u003c/code>: tiene cada archivo tal como debe quedar (y está verificado: compila sin errores).\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"note\">Lo que ya sabes de bases de datos te va a servir mucho: en cada paso verás un recuadro \u003cstrong>🗄️ Con bases de datos…\u003c/strong> que compara lo nuevo con tablas, filas y consultas.\u003c/div>","created":[]},{"section":"Antes de empezar","title":"Tu punto de partida","kind":"intro","body":"\n\u003cp>Partimos de lo que ya hiciste con tus comandos:\u003c/p>\n\u003col>\n  \u003cli>\u003ccode>npx degit github:microsoft/PowerAppsCodeApps/templates/vite .\u003c/code> → descargó la \u003cstrong>plantilla\u003c/strong>.\u003c/li>\n  \u003cli>\u003ccode>npm install\u003c/code> → descargó las librerías en \u003ccode>node_modules\u003c/code>.\u003c/li>\n  \u003cli>\u003ccode>pac auth create\u003c/code> y \u003ccode>pac code init\u003c/code> → conectaron el proyecto con tu entorno y crearon \u003ccode>power.config.json\u003c/code>.\u003c/li>\n  \u003cli>El script \u003ccode>dataverse-schema-tool\u003c/code> creó las tablas en Dataverse, y \u003ccode>npm run seed\u003c/code> cargó las personas base.\u003c/li>\n\u003c/ol>\n\u003cp>La plantilla trae estos archivos (los que importan para nosotros):\u003c/p>\n\u003cpre class=\"tree\">Onboarding-and-Micro-learning/\n├── index.html          ← la única página HTML\n├── package.json        ← comandos (npm run dev) y librerías\n├── vite.config.ts      ← configuración del servidor de desarrollo\n├── tsconfig.app.json   ← configuración de TypeScript\n├── power.config.json   ← lo creó pac code init (tu entorno y tus tablas)\n├── public/vite.svg\n└── src/\n    ├── main.tsx        ← el primer archivo de código que se ejecuta\n    ├── App.tsx         ← un ejemplo con un contador\n    ├── App.css, index.css\n    └── assets/react.svg\u003c/pre>\n\u003cdiv class=\"concept\">\u003cdiv class=\"concept__title\">💡 ¿Qué es cada cosa?\u003c/div>\n\u003cul>\n  \u003cli>\u003cstrong>HTML\u003c/strong>: la estructura de una página. \u003cstrong>CSS\u003c/strong>: su apariencia. \u003cstrong>JavaScript\u003c/strong>: su comportamiento.\u003c/li>\n  \u003cli>\u003cstrong>TypeScript\u003c/strong> (\u003ccode>.ts\u003c/code>, \u003ccode>.tsx\u003c/code>): JavaScript con \u003cem>tipos\u003c/em>; el editor te avisa en rojo si te equivocas.\u003c/li>\n  \u003cli>\u003cstrong>React\u003c/strong>: arma la pantalla con \u003cem>componentes\u003c/em> (funciones que devuelven lo que se dibuja).\u003c/li>\n  \u003cli>\u003cstrong>Vite\u003c/strong>: el servidor que muestra la app mientras programas y la recarga al guardar.\u003c/li>\n\u003c/ul>\u003c/div>","created":[]},{"section":"Preparar el proyecto","title":"Conectar las tablas que usa esta pantalla","kind":"command","body":"\n\u003cp>La pantalla de inicio lee dos tablas: \u003ccode>contact\u003c/code> (las personas) y \u003ccode>jsi_roleassignment\u003c/code> (sus roles). En tu lista de comandos falta la segunda: agrégala. Ejecuta en la terminal, en la raíz del proyecto (donde está \u003ccode>power.config.json\u003c/code>):\u003c/p>\n\u003cpre class=\"term\">pac code add-data-source -a dataverse -t contact\npac code add-data-source -a dataverse -t jsi_roleassignment\u003c/pre>\n\u003cp>Cada comando genera dos archivos dentro de \u003ccode>src/generated\u003c/code>:\u003c/p>\n\u003cul>\n  \u003cli>\u003ccode>models/ContactsModel.ts\u003c/code>: los \u003cstrong>tipos\u003c/strong> de las columnas de la tabla.\u003c/li>\n  \u003cli>\u003ccode>services/ContactsService.ts\u003c/code>: las funciones \u003ccode>getAll\u003c/code>, \u003ccode>get\u003c/code>, \u003ccode>create\u003c/code>, \u003ccode>update\u003c/code> y \u003ccode>delete\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"db\">\u003cdiv class=\"db__title\">🗄️ Con bases de datos…\u003c/div>\u003ccode>getAll()\u003c/code> ≈ \u003ccode>SELECT\u003c/code> · \u003ccode>create()\u003c/code> ≈ \u003ccode>INSERT\u003c/code> · \u003ccode>update()\u003c/code> ≈ \u003ccode>UPDATE\u003c/code> · \u003ccode>delete()\u003c/code> ≈ \u003ccode>DELETE\u003c/code>. Los filtros se escriben en \u003cstrong>OData\u003c/strong>: \u003ccode>jsi_role eq 100000001\u003c/code> es como \u003ccode>WHERE jsi_role = 100000001\u003c/code>.\u003c/div>\n\u003cdiv class=\"note warn\">\u003cstrong>Nunca edites\u003c/strong> lo que hay en \u003ccode>src/generated\u003c/code>: si cambias una columna en Dataverse, vuelves a ejecutar el comando y PAC lo regenera.\u003c/div>","check":["Existe src/generated/services/ContactsService.ts.","Existe src/generated/services/Jsi_roleassignmentsService.ts."],"created":[]},{"section":"Preparar el proyecto","title":"Instalar dos librerías","kind":"command","body":"\n\u003cpre class=\"term\">npm install react-router lucide-react\u003c/pre>\n\u003cul>\n  \u003cli>\u003cstrong>react-router\u003c/strong>: decide qué pantalla mostrar según la dirección (URL). Lo usaremos para que \u003ccode>#/\u003c/code> muestre la pantalla de inicio.\u003c/li>\n  \u003cli>\u003cstrong>lucide-react\u003c/strong>: los íconos (el libro azul y la flechita de cada perfil).\u003c/li>\n\u003c/ul>\n\u003cp>npm las descarga en \u003ccode>node_modules\u003c/code> y las anota en \u003ccode>package.json\u003c/code>, en \u003ccode>\"dependencies\"\u003c/code>.\u003c/p>","check":["En package.json aparecen \"react-router\" y \"lucide-react\"."],"created":[]},{"section":"Preparar el proyecto","title":"Limpiar la plantilla","kind":"command","body":"\n\u003cp>La plantilla trae un ejemplo (un contador con logos) que no vamos a usar. Bórralo:\u003c/p>\n\u003cpre class=\"term\">Remove-Item src/App.css, src/index.css, public/vite.svg\nRemove-Item -Recurse src/assets\u003c/pre>\n\u003cp>Ahora deja \u003ccode>src/App.tsx\u003c/code> y \u003ccode>src/main.tsx\u003c/code> mínimos, para que la app siga funcionando mientras construimos. Son \u003cstrong>temporales\u003c/strong>: al final los reemplazamos.\u003c/p>","files":[{"path":"src/App.tsx  (temporal)","lines":["\u003cspan class=\"k\">export\u003c/span> \u003cspan class=\"k\">default\u003c/span> \u003cspan class=\"k\">function\u003c/span> \u003cspan class=\"f\">App\u003c/span>() {","  \u003cspan class=\"k\">return\u003c/span> &lt;h1&gt;\u003cspan class=\"t\">Hola\u003c/span>, empezamos&lt;/h1&gt;;","}"],"notes":[{"from":1,"to":1,"text":"Un \u003cstrong>componente\u003c/strong> de React es una función. \u003ccode>export default\u003c/code> permite que otro archivo la importe."},{"from":2,"to":2,"text":"Devuelve \u003cstrong>JSX\u003c/strong>: algo que parece HTML pero está dentro de JavaScript. Es lo que se dibuja."}]},{"path":"src/main.tsx  (temporal)","lines":["\u003cspan class=\"k\">import\u003c/span> { \u003cspan class=\"t\">StrictMode\u003c/span> } \u003cspan class=\"k\">from\u003c/span> \u003cspan class=\"s\">'react'\u003c/span>;","\u003cspan class=\"k\">import\u003c/span> { createRoot } \u003cspan class=\"k\">from\u003c/span> \u003cspan class=\"s\">'react-dom/client'\u003c/span>;","\u003cspan class=\"k\">import\u003c/span> \u003cspan class=\"t\">App\u003c/span> \u003cspan class=\"k\">from\u003c/span> \u003cspan class=\"s\">'./App'\u003c/span>;"," ","\u003cspan class=\"f\">createRoot\u003c/span>(document.\u003cspan class=\"f\">getElementById\u003c/span>(\u003cspan class=\"s\">'root'\u003c/span>)!).\u003cspan class=\"f\">render\u003c/span>(","  &lt;\u003cspan class=\"t\">StrictMode\u003c/span>&gt;","    &lt;\u003cspan class=\"t\">App\u003c/span> /&gt;","  &lt;/\u003cspan class=\"t\">StrictMode\u003c/span>&gt;,",");"],"notes":[{"from":2,"to":2,"text":"\u003ccode>import\u003c/code> trae código de otro archivo o librería. Aquí traemos la función que conecta React con la página."},{"from":3,"to":3,"text":"Trae nuestro componente App (borramos la línea que importaba \u003ccode>index.css\u003c/code>, porque ya no existe)."},{"from":5,"to":5,"text":"Busca en \u003ccode>index.html\u003c/code> el \u003ccode>&lt;div id=\"root\"&gt;\u003c/code> y le dice a React: «dibuja aquí»."},{"from":7,"to":7,"text":"Usa el componente como una etiqueta. \u003ccode>StrictMode\u003c/code> solo agrega avisos en desarrollo."}]}],"check":["Ejecutas \u003ccode>npm run dev\u003c/code>, abres el enlace «Local Play» y ves «Hola, empezamos».","Si cambias el texto y guardas, la página se actualiza sola."],"created":["src/App.tsx","src/main.tsx"]},{"section":"Preparar el proyecto","title":"Un atajo para las rutas: «@» = src","kind":"file","intro":"\u003cp>Sin un atajo, para importar un archivo lejano escribirías \u003ccode>../../../shared/…\u003c/code>. Con el alias \u003ccode>@\u003c/code> escribirás siempre \u003ccode>@/shared/…\u003c/code>. Hay que avisarle a \u003cstrong>Vite\u003c/strong> (que ejecuta la app) y a \u003cstrong>TypeScript\u003c/strong> (que revisa el código). Reemplaza el contenido de \u003ccode>vite.config.ts\u003c/code>:\u003c/p>","files":[{"path":"vite.config.ts","lines":["\u003cspan class=\"k\">import\u003c/span> { fileURLToPath, \u003cspan class=\"t\">URL\u003c/span> } \u003cspan class=\"k\">from\u003c/span> \u003cspan class=\"s\">'node:url'\u003c/span>;","\u003cspan class=\"k\">import\u003c/span> { defineConfig } \u003cspan class=\"k\">from\u003c/span> \u003cspan class=\"s\">'vite'\u003c/span>;","\u003cspan class=\"k\">import\u003c/span> react \u003cspan class=\"k\">from\u003c/span> \u003cspan class=\"s\">'@vitejs/plugin-react'\u003c/span>;","\u003cspan class=\"k\">import\u003c/span> { powerApps } \u003cspan class=\"k\">from\u003c/span> \u003cspan class=\"s\">'@microsoft/power-apps-vite/plugin'\u003c/span>;"," ","\u003cspan class=\"c\">// https://vite.dev/config/\u003c/span>","\u003cspan class=\"k\">export\u003c/span> \u003cspan class=\"k\">default\u003c/span> \u003cspan class=\"f\">defineConfig\u003c/span>({","  plugins: [\u003cspan class=\"f\">react\u003c/span>(), \u003cspan class=\"f\">powerApps\u003c/span>()],","  resolve: {","    alias: {","      \u003cspan class=\"s\">'@'\u003c/span>: \u003cspan class=\"f\">fileURLToPath\u003c/span>(\u003cspan class=\"k\">new\u003c/span> \u003cspan class=\"f\">URL\u003c/span>(\u003cspan class=\"s\">'./src'\u003c/span>, \u003cspan class=\"k\">import\u003c/span>.meta.url)),","    },","  },","});"],"notes":[{"from":1,"to":1,"text":"Herramientas de Node para convertir una dirección de archivo en una ruta de Windows."},{"from":8,"to":8,"text":"Los \u003cstrong>plugins\u003c/strong> de la plantilla: uno entiende React y el otro conecta el servidor con Power Apps (por eso aparece el enlace «Local Play»). No los quites."},{"from":10,"to":11,"text":"El alias: cuando escribas \u003ccode>@/algo\u003c/code>, Vite lo busca en \u003ccode>./src/algo\u003c/code>."}]}],"created":["src/App.tsx","src/main.tsx","vite.config.ts"]},{"section":"Preparar el proyecto","title":"El mismo atajo para TypeScript","kind":"file","intro":"\u003cp>En \u003ccode>tsconfig.app.json\u003c/code> agrega \u003ccode>\"paths\"\u003c/code> al final de \u003ccode>compilerOptions\u003c/code> (fíjate en la coma de la línea anterior). El resto ya venía en la plantilla:\u003c/p>","files":[{"path":"tsconfig.app.json","lines":["{","  \u003cspan class=\"s\">\"compilerOptions\"\u003c/span>: {","    \u003cspan class=\"s\">\"tsBuildInfoFile\"\u003c/span>: \u003cspan class=\"s\">\"./node_modules/.tmp/tsconfig.app.tsbuildinfo\"\u003c/span>,","    \u003cspan class=\"s\">\"target\"\u003c/span>: \u003cspan class=\"s\">\"ES2022\"\u003c/span>,","    \u003cspan class=\"s\">\"useDefineForClassFields\"\u003c/span>: \u003cspan class=\"k\">true\u003c/span>,","    \u003cspan class=\"s\">\"lib\"\u003c/span>: [\u003cspan class=\"s\">\"ES2022\"\u003c/span>, \u003cspan class=\"s\">\"DOM\"\u003c/span>, \u003cspan class=\"s\">\"DOM.Iterable\"\u003c/span>],","    \u003cspan class=\"s\">\"module\"\u003c/span>: \u003cspan class=\"s\">\"ESNext\"\u003c/span>,","    \u003cspan class=\"s\">\"types\"\u003c/span>: [\u003cspan class=\"s\">\"vite/client\"\u003c/span>],","    \u003cspan class=\"s\">\"skipLibCheck\"\u003c/span>: \u003cspan class=\"k\">true\u003c/span>,"," ","    \u003cspan class=\"c\">/* Bundler mode */\u003c/span>","    \u003cspan class=\"s\">\"moduleResolution\"\u003c/span>: \u003cspan class=\"s\">\"bundler\"\u003c/span>,","    \u003cspan class=\"s\">\"allowImportingTsExtensions\"\u003c/span>: \u003cspan class=\"k\">true\u003c/span>,","    \u003cspan class=\"s\">\"verbatimModuleSyntax\"\u003c/span>: \u003cspan class=\"k\">true\u003c/span>,","    \u003cspan class=\"s\">\"moduleDetection\"\u003c/span>: \u003cspan class=\"s\">\"force\"\u003c/span>,","    \u003cspan class=\"s\">\"noEmit\"\u003c/span>: \u003cspan class=\"k\">true\u003c/span>,","    \u003cspan class=\"s\">\"jsx\"\u003c/span>: \u003cspan class=\"s\">\"react-jsx\"\u003c/span>,"," ","    \u003cspan class=\"c\">/* Linting */\u003c/span>","    \u003cspan class=\"s\">\"strict\"\u003c/span>: \u003cspan class=\"k\">true\u003c/span>,","    \u003cspan class=\"s\">\"noUnusedLocals\"\u003c/span>: \u003cspan class=\"k\">true\u003c/span>,","    \u003cspan class=\"s\">\"noUnusedParameters\"\u003c/span>: \u003cspan class=\"k\">true\u003c/span>,","    \u003cspan class=\"s\">\"erasableSyntaxOnly\"\u003c/span>: \u003cspan class=\"k\">true\u003c/span>,","    \u003cspan class=\"s\">\"noFallthroughCasesInSwitch\"\u003c/span>: \u003cspan class=\"k\">true\u003c/span>,","    \u003cspan class=\"s\">\"noUncheckedSideEffectImports\"\u003c/span>: \u003cspan class=\"k\">true\u003c/span>,"," ","    \u003cspan class=\"c\">/* Alias: \"@/...\" apunta a \"src/...\" */\u003c/span>","    \u003cspan class=\"s\">\"paths\"\u003c/span>: {","      \u003cspan class=\"s\">\"@/*\"\u003c/span>: [\u003cspan class=\"s\">\"./src/*\"\u003c/span>]","    }","  },","  \u003cspan class=\"s\">\"include\"\u003c/span>: [\u003cspan class=\"s\">\"src\"\u003c/span>]","}"],"notes":[{"from":20,"to":20,"text":"Modo estricto: TypeScript revisa todo con cuidado. Mejor un aviso en rojo ahora que un error en producción."},{"from":25,"to":25,"text":"Esta línea ya existía: solo le agregamos la \u003cstrong>coma\u003c/strong> al final."},{"from":28,"to":29,"text":"Lo nuevo: \u003ccode>@/*\u003c/code> apunta a \u003ccode>./src/*\u003c/code>. Ahora VSCode entiende el atajo y no lo marca en rojo."}]}],"check":["Guardaste los dos archivos.","Si VSCode marca algo en rojo en tsconfig.app.json, revisa las comas."],"created":["src/App.tsx","src/main.tsx","vite.config.ts","tsconfig.app.json"]},{"section":"Preparar el proyecto","title":"Crear las carpetas","kind":"command","body":"\n\u003cp>Cada carpeta tiene una responsabilidad. Créalas todas de una vez:\u003c/p>\n\u003cpre class=\"term\">New-Item -ItemType Directory -Force src/app/session, src/modules/admin, src/modules/manager, src/modules/collaborator, src/modules/auth/pages, src/modules/auth/components, src/services, src/shared/components, src/shared/constants, src/shared/hooks, src/shared/lib, src/shared/styles, src/shared/types\u003c/pre>\n\u003ctable class=\"grid\">\n  \u003ctr>\u003cth>Carpeta\u003c/th>\u003cth>Qué va ahí\u003c/th>\u003c/tr>\n  \u003ctr>\u003ctd>\u003ccode>src/app\u003c/code>\u003c/td>\u003ctd>El arranque: App, las rutas y la sesión.\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003ccode>src/modules\u003c/code>\u003c/td>\u003ctd>Un módulo por rol (admin, manager, collaborator) y \u003ccode>auth\u003c/code> (la pantalla de inicio).\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003ccode>src/services\u003c/code>\u003c/td>\u003ctd>El código que lee y escribe en Dataverse. Las pantallas nunca hablan directo con Dataverse.\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003ccode>src/shared\u003c/code>\u003c/td>\u003ctd>Lo que comparten todos: componentes, tipos, estilos, utilidades.\u003c/td>\u003c/tr>\n  \u003ctr>\u003ctd>\u003ccode>src/generated\u003c/code>\u003c/td>\u003ctd>Lo generado por PAC (ya existe).\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cdiv class=\"db\">\u003cdiv class=\"db__title\">🗄️ Con bases de datos…\u003c/div>Igual que separas tablas por tema, el código se separa por responsabilidad. Si mañana cambia cómo se lee Dataverse, solo tocas \u003ccode>services\u003c/code>.\u003c/div>","created":["src/App.tsx","src/main.tsx","vite.config.ts","tsconfig.app.json"]},{"section":"Estilos","title":"Los colores de toda la app","kind":"file","intro":"\u003cp>Crea \u003ccode>src/shared/styles/global.css\u003c/code>. Aquí se definen los colores \u003cstrong>una sola vez\u003c/strong> y unas reglas base para toda la página:\u003c/p>","files":[{"path":"src/shared/styles/global.css","lines":["\u003cspan class=\"c\">/* ---------- Tokens de diseño (colores y medidas que usa toda la app) ---------- */\u003c/span>",":root {","  --color-primary: #\u003cspan class=\"n\">1\u003c/span>d4ed8;","  --color-danger: #dc2626;"," ","  --color-bg: #f3f5f9;","  --color-surface: #ffffff;","  --color-surface-muted: #f8fafc;","  --color-border: #e2e8f0;","  --color-text: #\u003cspan class=\"n\">0\u003c/span>f172a;","  --color-text-muted: #\u003cspan class=\"n\">64748\u003c/span>b;"," ","  --tone-info-bg: #eaf0ff;","  --radius-card: \u003cspan class=\"n\">12\u003c/span>px;"," ","  font-family: \u003cspan class=\"s\">'Segoe UI'\u003c/span>, system-ui, \u003cspan class=\"t\">Roboto\u003c/span>, sans-serif;","  line-height: \u003cspan class=\"n\">1\u003c/span>.\u003cspan class=\"n\">5\u003c/span>;","  color: \u003cspan class=\"k\">var\u003c/span>(--color-text);","}"," ","\u003cspan class=\"c\">/* ---------- Base ---------- */\u003c/span>","*,","*::before,","*::after {","  box-sizing: border-box;","}"," ","body {","  margin: \u003cspan class=\"n\">0\u003c/span>;","  background: \u003cspan class=\"k\">var\u003c/span>(--color-bg);","}"," ","h1,","p,","ul {","  margin: \u003cspan class=\"n\">0\u003c/span>;","}"," ","ul {","  padding: \u003cspan class=\"n\">0\u003c/span>;","  list-style: none;","}"," ","button {","  font: inherit;","}"],"notes":[{"from":2,"to":2,"text":"\u003ccode>:root\u003c/code> es la raíz de la página: lo que definas aquí lo ve todo el documento."},{"from":3,"to":3,"text":"Una \u003cstrong>variable CSS\u003c/strong> («token»). Se usa así: \u003ccode>color: var(--color-primary)\u003c/code>. Si mañana cambia el azul de la marca, cambias solo esta línea."},{"from":6,"to":11,"text":"Fondo de la página, superficie de las tarjetas, bordes y colores de texto."},{"from":14,"to":14,"text":"También se guardan medidas: el redondeo de las esquinas de las tarjetas."},{"from":16,"to":16,"text":"La letra de toda la app: Segoe UI (la de Windows)."},{"from":25,"to":25,"text":"Hace que el ancho de una caja incluya su borde y su relleno. Evita sorpresas al medir."},{"from":28,"to":30,"text":"Quita el margen que el navegador pone por defecto y pinta el fondo gris claro."},{"from":41,"to":41,"text":"Las listas (\u003ccode>ul\u003c/code>) sin viñetas: las usamos para dibujar los perfiles."}]}],"db":"Una variable CSS es como un valor de configuración guardado en una tabla de parámetros: se lee en muchos lugares y se cambia en uno.","created":["src/App.tsx","src/main.tsx","vite.config.ts","tsconfig.app.json","src/shared/styles/global.css"]},{"section":"Estilos","title":"El estilo del avatar","kind":"file","intro":"\u003cp>Crea \u003ccode>src/shared/styles/components.css\u003c/code> para los componentes compartidos. Por ahora solo el avatar (el círculo con iniciales):\u003c/p>","files":[{"path":"src/shared/styles/components.css","lines":["\u003cspan class=\"c\">/* Estilos de los componentes compartidos (src/shared/components). */\u003c/span>"," ","\u003cspan class=\"c\">/* ---------- Avatar: círculo con las iniciales ---------- */\u003c/span>",".avatar {","  display: grid;","  place-items: center;","  flex-shrink: \u003cspan class=\"n\">0\u003c/span>;","  border-radius: \u003cspan class=\"n\">50\u003c/span>%;","  background: #\u003cspan class=\"n\">1\u003c/span>e3a8a;","  color: #fff;","  font-weight: \u003cspan class=\"n\">700\u003c/span>;","}"," ",".avatar--sm {","  width: \u003cspan class=\"n\">32\u003c/span>px;","  height: \u003cspan class=\"n\">32\u003c/span>px;","  font-size: \u003cspan class=\"n\">12\u003c/span>px;","}"," ",".avatar--md {","  width: \u003cspan class=\"n\">38\u003c/span>px;","  height: \u003cspan class=\"n\">38\u003c/span>px;","  font-size: \u003cspan class=\"n\">13\u003c/span>px;","}"],"notes":[{"from":4,"to":4,"text":"Una \u003cstrong>clase CSS\u003c/strong>: se aplica a cualquier elemento con \u003ccode>className=\"avatar\"\u003c/code>."},{"from":6,"to":6,"text":"Centra las iniciales dentro del círculo."},{"from":8,"to":8,"text":"Esquinas redondeadas al 50% = un círculo."},{"from":14,"to":14,"text":"Una \u003cstrong>variante\u003c/strong> de tamaño. El nombre \u003ccode>bloque--variante\u003c/code> sigue la convención \u003cstrong>BEM\u003c/strong>, que evita que los estilos choquen."}]}],"created":["src/App.tsx","src/main.tsx","vite.config.ts","tsconfig.app.json","src/shared/styles/global.css","src/shared/styles/components.css"]},{"section":"Datos","title":"Los valores del rol (columna Choice)","kind":"file","intro":"\u003cp>En Dataverse, \u003ccode>jsi_roleassignment.jsi_role\u003c/code> es una columna \u003cstrong>Choice\u003c/strong>: guarda números. Para no escribir números sueltos por todo el código, les ponemos nombre. Crea \u003ccode>src/shared/constants/choices.ts\u003c/code>:\u003c/p>","files":[{"path":"src/shared/constants/choices.ts","lines":["\u003cspan class=\"c\">/**\u003c/span>","\u003cspan class=\"c\"> * Valores numéricos de las columnas Choice de Dataverse.\u003c/span>","\u003cspan class=\"c\"> * El tipo viene del modelo generado por PAC: si un valor cambia en Dataverse,\u003c/span>","\u003cspan class=\"c\"> * TypeScript marcará el error aquí.\u003c/span>","\u003cspan class=\"c\"> */\u003c/span>","\u003cspan class=\"k\">import\u003c/span> \u003cspan class=\"k\">type\u003c/span> { \u003cspan class=\"t\">Jsi_roleassignmentsjsi_role\u003c/span> } \u003cspan class=\"k\">from\u003c/span> \u003cspan class=\"s\">'@/generated/models/Jsi_roleassignmentsModel'\u003c/span>;"," ","\u003cspan class=\"c\">/** jsi_roleassignment.jsi_role */\u003c/span>","\u003cspan class=\"k\">export\u003c/span> \u003cspan class=\"k\">const\u003c/span> \u003cspan class=\"t\">ROLE\u003c/span> = {","  \u003cspan class=\"t\">Administrator\u003c/span>: \u003cspan class=\"n\">100000000\u003c/span>,","  \u003cspan class=\"t\">Manager\u003c/span>: \u003cspan class=\"n\">100000001\u003c/span>,","  \u003cspan class=\"t\">Collaborator\u003c/span>: \u003cspan class=\"n\">100000002\u003c/span>,","} \u003cspan class=\"k\">as\u003c/span> \u003cspan class=\"k\">const\u003c/span> \u003cspan class=\"k\">satisfies\u003c/span> \u003cspan class=\"t\">Record\u003c/span>&lt;string, \u003cspan class=\"t\">Jsi_roleassignmentsjsi_role\u003c/span>&gt;;"," ","\u003cspan class=\"c\">/** Uno de los tres valores de ROLE: 100000000 | 100000001 | 100000002. */\u003c/span>","\u003cspan class=\"k\">export\u003c/span> \u003cspan class=\"k\">type\u003c/span> \u003cspan class=\"f\">RoleValue\u003c/span> = (\u003cspan class=\"k\">typeof\u003c/span> \u003cspan class=\"t\">ROLE\u003c/span>)[\u003cspan class=\"k\">keyof\u003c/span> \u003cspan class=\"k\">typeof\u003c/span> \u003cspan class=\"t\">ROLE\u003c/span>];"],"notes":[{"from":6,"to":6,"text":"Trae el \u003cstrong>tipo\u003c/strong> que generó PAC con los valores válidos de la columna. \u003ccode>import type\u003c/code> = solo se importa la descripción, no código."},{"from":9,"to":9,"text":"Un \u003cstrong>objeto\u003c/strong>: pares nombre → valor. \u003ccode>export\u003c/code> permite usarlo desde otros archivos."},{"from":10,"to":12,"text":"Los mismos números que guarda Dataverse. En el código escribirás \u003ccode>ROLE.Manager\u003c/code> en vez de \u003ccode>100000001\u003c/code>."},{"from":13,"to":13,"text":"\u003ccode>as const\u003c/code>: los valores no cambian. \u003ccode>satisfies\u003c/code>: TypeScript comprueba que cada número exista en la columna de Dataverse. Si alguien cambia la columna y regenera, aquí aparece un error en rojo."},{"from":16,"to":16,"text":"Un tipo que significa «uno de esos tres números». Lo usarán otras funciones para aceptar solo roles válidos."}]}],"db":"Es una tabla de catálogo: \u003ccode>100000000 = Administrator, 100000001 = Manager, 100000002 = Collaborator\u003c/code>. El código usa el nombre y Dataverse guarda el número.","created":["src/App.tsx","src/main.tsx","vite.config.ts","tsconfig.app.json","src/shared/styles/global.css","src/shared/styles/components.css","src/shared/constants/choices.ts"]},{"section":"Datos","title":"Describir los datos: los tipos","kind":"file","intro":"\u003cp>Crea \u003ccode>src/shared/types/navigation.ts\u003c/code>. Aquí describimos la \u003cstrong>forma\u003c/strong> de los datos que maneja la pantalla:\u003c/p>","files":[{"path":"src/shared/types/navigation.ts","lines":["\u003cspan class=\"k\">import\u003c/span> \u003cspan class=\"k\">type\u003c/span> { \u003cspan class=\"t\">RoleValue\u003c/span> } \u003cspa an class=\"f\">setState\u003c/span>({ data, error: \u003cspan class=\"k\">undefined\u003c/span>, loading: \u003cspan class=\"k\">false\u003c/span> }),","      (error: unknown) =&gt;","        active &amp;&amp;","        \u003cspan class=\"f\">setState\u003c/span>((prev) =&gt; ({","          data: prev.data,","          error: error instanceof \u003cspan class=\"t\">Error\u003c/span> ? error : \u003cspan class=\"k\">new\u003c/span> \u003cspan class=\"f\">Error\u003c/span>(\u003cspan class=\"f\">String\u003c/span>(error)),","          loading: \u003cspan class=\"k\">false\u003c/span>,","        })),","    );","    \u003cspan class=\"c\">// Si el componente se cierra antes de terminar, se ignora el resultado.\u003c/span>","    \u003cspan class=\"k\">return\u003c/span> () =&gt; {","      active = \u003cspan class=\"k\">false\u003c/span>;","    };","  }, [loader, version]);"," ","  \u003cspan class=\"c\">/** Vuelve a cargar los datos. */\u003c/span>","  \u003cspan class=\"k\">const\u003c/span> reload = \u003cspan class=\"f\">useCallback\u003c/span>(() =&gt; {","    \u003cspan class=\"f\">setState\u003c/span>((prev) =&gt; ({ ...prev, error: \u003cspan class=\"k\">undefined\u003c/span>, loading: \u003cspan class=\"k\">true\u003c/span> }));","    \u003cspan class=\"f\">setVersion\u003c/span>((value) =&gt; value + \u003cspan class=\"n\">1\u003c/span>);","  }, []);"," ","  \u003cspan class=\"k\">return\u003c/span> { ...state, reload };","}"],"notes":[{"from":1,"to":1,"text":"Tres \u003cstrong>hooks\u003c/strong> de React. Un hook es una función que empieza con \u003ccode>use\u003c/code> y le da memoria o comportamiento a un componente."},{"from":3,"to":3,"text":"La forma del estado: los datos, el error y si está cargando."},{"from":13,"to":13,"text":"Recibe \u003ccode>loader\u003c/code>: la función que trae los datos (por ejemplo, \u003ccode>listPeopleWithRole\u003c/code>)."},{"from":14,"to":14,"text":"\u003cstrong>useState\u003c/strong> guarda un valor que, al cambiar con \u "src/services/people.service.ts","src/shared/hooks/useAsync.ts","src/app/session/SessionContext.ts","src/app/session/SessionProvider.tsx","src/app/session/useSession.ts","src/modules/admin/admin.module.ts","src/modules/manager/manager.module.ts","src/modules/collaborator/collaborator.module.ts","src/modules/index.ts","src/shared/lib/format.ts","src/shared/components/Avatar.tsx","src/modules/auth/components/RolePeopleList.tsx","src/modules/auth/pages/RoleSelectPage.css","src/modules/auth/pages/RoleSelectPage.tsx","src/app/router.tsx","src/app/App.tsx","src/main.tsx","index.html"]},{"section":"Probar","title":"Resumen: el camino completo","kind":"intro","body":"\n\u003cp>Esto es lo que pasa desde que abres la app hasta que ves la lista de personas:\u003c/p>\n\u003col class=\"flow\">\n  \u003cli>\u003ccode>index.html\u003c/code> carga \u003ccode>main.tsx\u003c/code>.\u003c/li>\n  \u003cli>\u003ccode>main.tsx\u003c/code> carga los estilos y dibuja \u003ccode>App\u003c/code> en el \u003ccode>div#root\u003c/code>.\u003c/li>\n  \u003cli>\u003ccode>App\u003c/code> envuelve todo con la \u003cstrong>sesión\u003c/strong> y el \u003cstrong>router\u003c/strong>.\u003c/li>\n  \u003cli>El router ve la dirección \u003ccode>#/\u003c/code> y dibuja \u003ccode>RoleSelectPage\u003c/code>.\u003c/li>\n  \u003cli>\u003ccode>RoleSelectPage\u003c/code> recorre \u003ccode>roleModules\u003c/code> y dibuja los tres perfiles.\u003c/li>\n  \u003cli>Al hacer clic en uno, cambia el estado \u003ccode>openRole\u003c/code> y se dibuja \u003ccode>RolePeopleList\u003c/code>.\u003c/li>\n  \u003cli>\u003ccode>RolePeopleList\u003c/code> usa \u003ccode>useAsync\u003c/code>, que llama a \u003ccode>listPeopleWithRole\u003c/code>.\u003c/li>\n  \u003cli>El servicio usa \u003ccode>ContactsService\u003c/code> y \u003ccode>Jsi_roleassignmentsService\u003c/code> (generados) → Dataverse.\u003c/li>\n  \u003cli>Llegan los datos: se dibujan las personas con su \u003ccode>Avatar\u003c/code>.\u003c/li>\n  \u003cli>Al el const KEY = 'tutorial-parte-1-paso';
let current = 0;
try { current = Math.min(DATA.steps.length - 1, Number(localStorage.getItem(KEY)) || 0); } catch (e) {}

const $ = (id) => document.getElementById(id);

function renderNav() {
  let html = '', last = '';
  DATA.steps.forEach((s, i) => {
    if (s.section !== last) { html += '<div class="sec">' + s.section + '</div>'; last = s.section; }
    html += '<button data-i="' + i + '" class="' + (i === current ? 'on' : i < current ? 'done' : '') + '"><span class="n">' + (i + 1) + '</span><span>' + s.title + '</span></button>';
  });
  $('nav').innerHTML = html;
  $('nav').querySelectorAll('button').forEach((b) => (b.onclick = () => go(Number(b.dataset.i))));
  const created = new Set(DATA.steps[current].created);
  const fresh = new Set((DATA.steps[current].files || []).map((f) => f.path.split('  ')[0]));
  $('tree').innerHTML = DATA.tree.map((f) => '<div class="' + (fresh.has(f) ? 'new' : created.has(f) ? 'ok' : '') + '">' + (fresh.has(f) ? '● ' : created.has(f) ? '✓ ' : '○ ') + f + '</div>').join('');
}

function fileHtml(file, fi) {
  const code = file.lines.map((l, i) => '<div data-l="' + (i + 1) + '"><span class="ln">' + (i + 1) + '</span><span>' + l + '</span></div>').join('');
  const notes = file.notes.map((n) => '<div class="note-i" data-from="' + n.from + '" data-to="' + n.to + '"><span class="tag">' + (n.from === n.to ? n.from : n.from + '–' + n.to) + '</span><span>' + n.t + '</span></div>').join('');
  return '<div class="file" data-f="' + fi + '"><div class="file__head">📄 ' + file.path + '<button class="copy" data-f="' + fi + '">Copiar</button></div>' +
    '<div class="file__body"><div class="code">' + code + '</div><div class="notes">' + (notes || '<p>Sin notas.</p>') + '</div></div></div>';
}

function render() {
  const s = DATA.steps[current];
  let html = '<div class="crumb">Paso ' + (current + 1) + ' de ' + DATA.steps.length + ' · ' + s.section + '</div><h2>' + s.title + '</h2>';
  if (s.intro) html += s.intro;
  if (s.body) html += s.body;
  (s.files || []).forEach((f, i) => (html += fileHtml(f, i)));
  if (s.db) html += '<div class="db"><div class="db__title">🗄️ Con bases de datos…</div>' + s.db + '</div>';
  if (s.check) html += '<div class="check"><div class="check__title">✅ Comprueba antes de seguir</div><ul>' + s.check.map((c) => '<li><label><input type="checkbox">' + c + '</label></li>').join('') + '</ul></div>';
  $('content').innerHTML = html;
  $('main').scrollTop = 0;
  $('bar').style.width = ((current + 1) / DATA.steps.length) * 100 + '%';
  $('count').textContent = (current + 1) + ' / ' + DATA.steps.length;
  $('prev').disabled = current === 0;
  $('next').disabled = current === DATA.steps.length - 1;
  renderNav();

  // Resaltar la línea al pasar sobre su explicación
  document.querySelectorAll('.file').forEach((fileEl) => {
    fileEl.querySelectorAll('.note-i').forEach((n) => {
      const from = Number(n.dataset.from), to = Number(n.dataset.to);
      const lines = [...fileEl.querySelectorAll('.code div')].filter((d) => { const l = Number(d.dataset.l); return l >= from && l <= to; });
      n.onmouseenter = () => { lines.forEach((d) => d.classList.add('hl')); lines[0] && lines[0].scrollIntoView({ block: 'nearest' }); };
      n.onmouseleave = () => lines.forEach((d) => d.classList.remove('hl'));
    });
  });
  // Copiar el código
  document.querySelectorAll('.copy').forEach((b) => {
    b.onclick = async () => {
      const text = [...b.closest('.file').querySelectorAll('.code div')].map((d) => d.lastChild.textContent).join('\n');
      try { await navigator.clipboard.writeText(text); b.textContent = '¡Copiado!'; } catch (e) { b.textContent = 'Selecciónalo a mano'; }
      setTimeout(() => (b.textContent = 'Copiar'), 1500);
    };
  });
}

function go(i) {
  current = Math.max(0, Math.min(DATA.steps.length - 1, i));
  try { localStorage.setItem(KEY, String(current)); } catch (e) {}
  render();
}
$('prev').onclick = () => go(current - 1);
$('next').onclick = () => go(current + 1);
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') go(current + 1);
  if (e.key === 'ArrowLeft') go(current - 1);
});
render();
</script>
